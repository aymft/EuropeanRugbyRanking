name: Update rugby rankings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run pipeline regression tests
        run: python -m unittest discover -v

      - name: Update latest TOP 14 results
        id: update_top14
        continue-on-error: true
        run: python -m src.update_latest_top14

      - name: Update latest URC results
        id: update_urc
        continue-on-error: true
        run: python -m src.update_latest_urc

      - name: Update latest Premiership results
        id: update_premiership
        continue-on-error: true
        run: python -m src.update_latest_premiership

      - name: Update latest EPCR results
        id: update_epcr
        continue-on-error: true
        run: python -m src.update_latest_epcr

      - name: Update weekend fixtures and live scores
        run: python -m src.update_live_results

      - name: Generate rankings
        run: python -m src.generate_rankings

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add data/processed/matches_history.csv
            git add data/processed/rankings.csv
            git add docs/data/rankings.csv
            git add docs/data/rankings.json
            git add docs/data/live_results.json
            git commit -m "Auto-update rugby rankings"
            git push
          else
            echo "No ranking update to commit."
          fi

      - name: Report source update failures
        if: >-
          always() &&
          (steps.update_top14.outcome == 'failure' ||
           steps.update_urc.outcome == 'failure' ||
           steps.update_premiership.outcome == 'failure' ||
           steps.update_epcr.outcome == 'failure')
        run: |
          echo "At least one source updater failed; successful sources were still published."
          exit 1
